[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miraeasset-b-agent"
version = "0.1.0"
description = "Deterministic query planning and evidence routing for the financial product RAG agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ontology-validation = ["rdflib==7.6.0", "pyshacl==0.40.1"]

[tool.setuptools]
packages = ["b_agent"]
