name: Ontology validation

on:
  pull_request:
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - "tests/test_ontology_schema.py"
      - "tests/fixtures/ontology/**"
      - "b_agent/postgres_gateway.py"
      - "pyproject.toml"
      - ".github/workflows/ontology-validation.yml"
  push:
    branches: [main]
    paths:
      - "ontology/**"
      - "scripts/validate_ontology.py"
      - "tests/test_ontology_schema.py"
      - "tests/fixtures/ontology/**"
      - "b_agent/postgres_gateway.py"
      - "pyproject.toml"
      - ".github/workflows/ontology-validation.yml"

permissions:
  contents: read

jobs:
  ontology-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline validation dependencies
        run: python -m pip install -e ".[ontology-validation]"
      - name: Validate five schemas and meta-SHACL
        run: python scripts/validate_ontology.py
      - name: Run RDF and SHACL regressions
        run: python -m unittest tests.test_ontology_schema -v
